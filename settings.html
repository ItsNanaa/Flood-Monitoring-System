<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Flood Monitoring System</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Nunito', sans-serif; }
        .tab-active { background: linear-gradient(135deg, #4ade80 0%, #22c55e 100%); color: white; }
        .card-shadow { box-shadow: 0 4px 20px rgba(34, 197, 94, 0.1); }
        @keyframes pulse-soft { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        .pulse-indicator { animation: pulse-soft 2s ease-in-out infinite; }
        @keyframes fade-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fade-in 0.4s ease-out; }
        body { box-sizing: border-box; }
    </style>
</head>
<body class="h-full bg-gradient-to-br from-blue-50 via-cyan-50 to-teal-50">
<div id="app" class="h-full w-full overflow-auto">
    <!-- Header -->
    <header class="bg-white/80 backdrop-blur-sm border-b border-blue-100 sticky top-0 z-10">
        <div class="max-w-6xl mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-gradient-to-br from-blue-400 to-cyan-500 rounded-xl flex items-center justify-center"><span class="text-white text-xl">🌊</span></div>
                    <div>
                        <h1 class="text-xl font-bold text-gray-800">Flood Monitoring System</h1>
                        <p class="text-xs text-gray-500">Real-time Water Level Tracking</p>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <div class="flex items-center gap-2"><span id="connection-status" class="pulse-indicator w-2 h-2 bg-red-500 rounded-full"></span> <span id="status-text" class="text-sm text-gray-600">Connecting...</span></div>
                    <button onclick="location.href='index.html'" class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl transition-all flex items-center gap-2 shadow-lg">🆘 SOS</button>
                </div>
            </div>
        </div>
    </header>

    <!-- Navigation Tabs -->
    <nav class="max-w-6xl mx-auto px-4 py-4">
        <div class="flex gap-2 bg-white/60 p-2 rounded-2xl flex-wrap">
            <button onclick="location.href='dashboard.html'" class="tab-btn flex-1 py-3 px-4 rounded-xl font-semibold text-sm transition-all text-gray-600">📊 Dashboard</button>
            <button onclick="location.href='alerts.html'" class="tab-btn flex-1 py-3 px-4 rounded-xl font-semibold text-sm transition-all text-gray-600">🚨 Alerts</button>
            <button onclick="location.href='history.html'" class="tab-btn flex-1 py-3 px-4 rounded-xl font-semibold text-sm transition-all text-gray-600">📈 History</button>
            <button onclick="location.href='settings.html'" class="tab-btn flex-1 py-3 px-4 rounded-xl font-semibold text-sm transition-all tab-active">⚙️ Settings</button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-4 pb-8">
        <div class="grid md:grid-cols-2 gap-6 mb-6">
            <!-- Firebase Configuration -->
            <div class="bg-white rounded-2xl p-6 card-shadow">
                <h3 class="font-semibold text-gray-800 mb-4">🔧 Firebase Configuration</h3>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-2">Firebase URL</label>
                        <input type="text" id="firebase-url" placeholder="https://your-project.firebaseio.com" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-2">Database Path</label>
                        <input type="text" id="database-path" placeholder="floodMonitoring/sensorData" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <button onclick="testFirebaseConnection()" class="w-full bg-blue-500 hover:bg-blue-600 text-white py-2 rounded-lg font-semibold">🧪 Test Connection</button>
                </div>
            </div>

            <!-- Telegram Configuration -->
            <div class="bg-white rounded-2xl p-6 card-shadow">
                <h3 class="font-semibold text-gray-800 mb-4">📱 Telegram Bot Setup</h3>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-2">Bot Token</label>
                        <input type="password" id="telegram-token" placeholder="1234567890:ABCdef..." class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-2">Chat ID</label>
                        <input type="text" id="telegram-chat-id" placeholder="123456789" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div class="bg-blue-50 p-3 rounded-lg border border-blue-200">
                        <p class="text-xs text-blue-700"><strong>Setup Instructions:</strong></p>
                        <p class="text-xs text-blue-600 mt-1">1. Create a Telegram bot with @BotFather</p>
                        <p class="text-xs text-blue-600">2. Get your Chat ID from @userinfobot</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- System Preferences -->
        <div class="bg-white rounded-2xl p-6 card-shadow">
            <h3 class="font-semibold text-gray-800 mb-4">⚙️ System Preferences</h3>
            <div class="grid md:grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-2">Update Frequency (seconds)</label>
                    <select id="update-frequency" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:outline-none">
                        <option value="5">Every 5 seconds</option>
                        <option value="10" selected>Every 10 seconds</option>
                        <option value="30">Every 30 seconds</option>
                        <option value="60">Every 1 minute</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-2">Alert Sound</label>
                    <select id="alert-sound" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:outline-none">
                        <option value="on" selected>Enabled</option>
                        <option value="off">Disabled</option>
                    </select>
                </div>
            </div>
            <button onclick="saveSettings()" class="w-full bg-gradient-to-r from-green-500 to-emerald-500 text-white py-2 rounded-lg font-semibold hover:from-green-600 hover:to-emerald-600">💾 Save Settings</button>
        </div>
    </main>
</div>

<script src="js/config.js"></script>
<script src="js/settings.js"></script>
</body>
</html>
